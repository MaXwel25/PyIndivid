<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/museum/styles.css">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }
        
        .back-btn {
            color: #3498db;
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .back-btn:hover {
            text-decoration: underline;
        }
        
        .form-block {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 4px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: bold;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
        }
        
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        .btn-cancel {
            background-color: #95a5a6;
            color: white;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 4px;
            display: inline-block;
            font-size: 14px;
        }
        
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
        
        .form-actions {
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'hall_list' %}" class="back-btn">Назад к списку</a>
        
        <h1>{{ title }}</h1>
        
        <div class="form-block">
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="error">{{ field.errors }}</div>
                    {% endif %}
                    {% if field.help_text %}
                    <div style="color: #7f8c8d; font-size: 12px; margin-top: 5px;">
                        {{ field.help_text }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
                
                <div class="form-actions">
                    <button type="submit" class="btn">Сохранить</button>
                    <a href="{% url 'hall_list' %}" class="btn-cancel">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
