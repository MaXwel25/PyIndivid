<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/museum/styles.css">
    <style>
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #fff; margin-bottom: 30px; }
        .back-btn { 
            color: #4dabf7; 
            text-decoration: none; 
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-btn:hover { text-decoration: underline; }
        .form-block { 
            background-color: #1f1f1f; 
            border: 1px solid white;
            padding: 25px;
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #ccc;
            font-weight: bold;
        }
        input, textarea, select { 
            width: 100%; 
            padding: 10px;
            background-color: #111111;
            color: white;
            border: 1px solid #444;
            font-family: Arial;
        }
        input:focus, textarea:focus, select:focus { 
            outline: none;
            border-color: #4dabf7;
        }
        .error { 
            color: #ff6b6b; 
            font-size: 0.9em;
            margin-top: 5px;
        }
        .btn { 
            background-color: #1f1f1f; 
            color: white; 
            padding: 12px 25px; 
            border: 1px solid white;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }
        .btn:hover { background-color: #333; }
        .btn-submit { background-color: #2b8a3e; border-color: #2b8a3e; }
        .btn-submit:hover { background-color: #2f9e44; }
        .btn-cancel { 
            background-color: #111; 
            color: #ccc;
            text-decoration: none;
            padding: 11px 20px;
            display: inline-block;
        }
        .btn-cancel:hover { background-color: #222; }
        .form-actions { margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'home' %}" class="back-btn">Назад к списку</a>
        
        <h1>{{ title }}</h1>
        
        <div class="container form-block">
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="error">{{ field.errors }}</div>
                    {% endif %}
                    {% if field.help_text %}
                    <div style="color: #888; font-size: 0.9em; margin-top: 5px;">
                        {{ field.help_text }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Сохранить</button>
                    <a href="{% url 'home' %}" class="btn-cancel">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
